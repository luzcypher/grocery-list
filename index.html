<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b5e20">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Grocery List</title>
  <style>
    :root { --bg:#eef5ee; --card:#fff; --ink:#142016; --muted:#66706a; --green:#2e7d32; --green-dark:#1b5e20; --red:#c62828; --line:#d7e4d8; --shadow:0 8px 24px rgba(20,32,22,.08); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:linear-gradient(180deg,#dcefdc 0%,var(--bg) 160px); color:var(--ink); min-height:100vh; }
    .app { max-width:460px; margin:0 auto; padding:16px 14px 36px; }
    header { text-align:center; padding:8px 0 4px; }
    h1 { font-size:1.55rem; letter-spacing:-.03em; }
    .sub { color:var(--muted); font-size:.92rem; margin-top:4px; }
    .top-row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:14px 0 8px; }
    .toggle { display:flex; gap:6px; }
    .toggle button, .chip, .btn { border:0; cursor:pointer; font-weight:650; font-family:inherit; }
    .toggle button { border:2px solid var(--green); background:#fff; color:var(--green-dark); border-radius:999px; padding:7px 13px; font-size:.85rem; }
    .toggle button.active { background:var(--green); color:#fff; }
    .chip { background:#fff; color:var(--green-dark); border:1px solid var(--line); border-radius:999px; padding:8px 12px; font-size:.85rem; }
    .mic-wrap { display:flex; flex-direction:column; align-items:center; gap:8px; margin:10px 0 6px; }
    .mic { width:92px; height:92px; border:0; border-radius:50%; background:var(--green); color:#fff; font-size:2.1rem; cursor:pointer; box-shadow:0 10px 22px rgba(46,125,50,.32); }
    .mic.listening { background:var(--red); animation:pulse 1s infinite; }
    .mic:disabled { opacity:.45; cursor:not-allowed; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    .status { min-height:1.3em; color:var(--muted); text-align:center; font-size:.92rem; }
    form.add { display:flex; gap:8px; margin:12px 0 8px; }
    form.add input, .field { flex:1; border:1px solid var(--line); border-radius:12px; padding:12px 13px; font-size:1rem; background:#fff; }
    .btn.primary { background:var(--green-dark); color:#fff; border-radius:12px; padding:12px 14px; }
    .btn.ghost { background:transparent; color:var(--green-dark); padding:8px 4px; }
    .btn.danger { background:transparent; color:var(--red); }
    .meta { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:.86rem; margin:4px 0 8px; }
    .list { list-style:none; position:relative; }
    .row { background:var(--card); border-top:1px solid var(--line); touch-action:pan-y; overflow:hidden; }
    .row:first-child { border-top:0; }
    .row-inner { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px; background:#fff; transition:transform .18s ease,opacity .18s ease; }
    .row.removing .row-inner { opacity:0; }
    .row.removing.left .row-inner { transform:translateX(-120%); }
    .row.removing.right .row-inner { transform:translateX(120%); }
    .row.done .item-text { text-decoration:line-through; color:var(--muted); }
    .row.done { opacity:.7; }
    .x { border:0; background:none; color:var(--red); font-size:1.35rem; cursor:pointer; padding:4px 6px; }
    .empty { text-align:center; color:var(--muted); padding:28px 8px; background:transparent; box-shadow:none; }
    .saved-card { background:#fff; border-radius:16px; box-shadow:var(--shadow); padding:12px; margin-top:8px; }
    .saved-item { display:grid; gap:8px; padding:12px 4px; border-bottom:1px solid var(--line); }
    .saved-item:last-child { border-bottom:0; }
    .saved-item h3 { font-size:1rem; }
    .saved-item p { color:var(--muted); font-size:.8rem; margin-top:2px; }
    .saved-actions { display:flex; flex-wrap:wrap; gap:6px; }
    .saved-actions button { border:1px solid var(--line); background:#f7faf7; border-radius:999px; padding:6px 10px; font-size:.75rem; font-weight:650; cursor:pointer; }
    .overlay { position:fixed; inset:0; background:rgba(16,28,18,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:20; }
    .chooser { background:#fff; border-radius:20px; padding:24px 20px; width:min(360px,100%); text-align:center; }
    .chooser h2 { margin-bottom:8px; }
    .chooser p { color:var(--muted); margin-bottom:18px; }
    .chooser .big { display:flex; flex-direction:column; gap:10px; }
    .chooser .big button { border:0; background:var(--green); color:#fff; border-radius:14px; padding:14px; font-size:1.05rem; font-weight:700; cursor:pointer; }
    .chooser .big button.alt { background:var(--green-dark); }
    .hidden { display:none !important; }
    .hint { text-align:center; color:var(--muted); font-size:.78rem; margin-top:16px; }
    .edit-bar { display:flex; gap:8px; margin-bottom:10px; }
    .edit-bar input { flex:1; }
    .toast {
      position: sticky; bottom: 12px; margin-top: 12px;
      background: #1b5e20; color: #fff; border-radius: 12px;
      padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .toast button { border:0; background:#fff; color:#1b5e20; border-radius:8px; padding:6px 10px; font-weight:700; cursor:pointer; }
    .item-text { flex:1; min-width:0; text-align:left; background:none; border:0; font: inherit; font-size:1.3rem; font-weight:550; line-height:1.3; color:var(--ink); overflow-wrap:anywhere; cursor:pointer; }
    .chips { display:flex; gap:6px; align-items:center; }
    .help-box { background:#fff; border-radius:20px; padding:22px 18px; width:min(400px,100%); max-height:86vh; overflow:auto; text-align:left; }
    .help-box h2 { text-align:center; margin-bottom:10px; }
    .help-box h3 { font-size:.95rem; margin:14px 0 6px; }
    .help-box p, .help-box li { color:var(--ink); font-size:.92rem; line-height:1.4; }
    .help-box ol { padding-left:1.2em; }
    .help-box li { margin-bottom:6px; color:#334; }
    .help-box .muted { color:var(--muted); text-align:center; margin-bottom:12px; }
    .perm {
      background:#fff3f0; border:1px solid #f3c4bc; color:#7a1f16;
      border-radius:14px; padding:12px 14px; margin:8px 0 4px; text-align:left; font-size:.9rem; line-height:1.4;
    }
    .perm b { display:block; margin-bottom:6px; }
    .store-row { display:flex; align-items:center; gap:8px; margin:4px 0 10px; }
    .store-row label { color:var(--muted); font-size:.86rem; font-weight:650; }
    .store-row select { min-width:0; padding:10px 12px; font-family:inherit; color:var(--ink); }
    .cat-card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; }
    .cat-head { display:flex; align-items:center; gap:10px; padding:10px 14px; text-align:left; background:#f3f8f3; border-bottom:1px solid var(--line); }
    .cat-emoji { font-size:1.4rem; line-height:1; }
    .cat-head h3 { flex:1; font-size:1.02rem; font-weight:750; color:var(--green-dark); }
    .cat-count { min-width:2em; text-align:center; background:#fff; border:1px solid var(--line); border-radius:999px; padding:2px 8px; color:var(--muted); font-size:.85rem; font-weight:700; font-variant-numeric:tabular-nums; }
    .cat-items { list-style:none; }
    .cat-head, .route-list li { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; cursor:grab; }
    .grip { display:flex; padding:6px 2px 6px 8px; color:var(--muted); fill:currentColor; touch-action:none; }
    .route-list li .grip { flex:none; padding:6px 4px; }
    .dragging { position:relative; z-index:5; cursor:grabbing; box-shadow:0 18px 40px rgba(20,32,22,.25); outline:2px solid var(--green); }
    .cat-card.dragging .cat-head { background:#e3f1e3; }
    .cat-card.uncat .cat-head { background:#fff8e6; }
    .cat-fix { flex:none; max-width:42%; border:1px solid #e8c77a; background:#fff8e6; color:#6b4a00; border-radius:999px; padding:6px 8px; font:inherit; font-size:.85rem; font-weight:650; cursor:pointer; }
    .help-box .route-list { position:relative; list-style:none; margin:12px 0 4px; padding:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; counter-reset:aisle; }
    .help-box .route-list li { margin:0; background:#fff; color:var(--ink); display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); counter-increment:aisle; }
    .route-list li:last-child { border-bottom:0; }
    .route-list li::before { content:counter(aisle); width:1.4em; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; }
    .route-list li span { flex:1; font-weight:600; }
    .route-list button { border:1px solid var(--line); background:#f7faf7; border-radius:8px; width:34px; height:34px; font-size:1rem; cursor:pointer; color:var(--green-dark); }
    .route-list button:disabled { opacity:.35; cursor:default; }
    .route-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; }
    .route-actions .btn.danger { margin-left:auto; }
    #routeName, #itemName { width:100%; }
    .cat-picks { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .cat-picks button { border:1px solid var(--line); background:#f7faf7; color:var(--green-dark); border-radius:999px; padding:8px 12px; font-family:inherit; font-size:.85rem; font-weight:650; cursor:pointer; }
    .cat-picks button[aria-pressed="true"] { background:var(--green); border-color:var(--green); color:#fff; }
    #itemHint { text-align:left; font-size:.82rem; margin:0; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1 id="title">Grocery List</h1>
      <p class="sub" id="subtitle"></p>
    </header>
    <div class="top-row">
      <div class="toggle">
        <button id="en" type="button">English</button>
        <button id="es" type="button">Español</button>
      </div>
      <div class="chips">
        <button class="chip" id="helpBtn" type="button">?</button>
        <button class="chip" id="navLists" type="button"></button>
      </div>
    </div>
    <section id="shopView">
      <div class="mic-wrap">
        <button class="mic" id="mic" type="button">🎤</button>
        <div class="status" id="status"></div>
        <div id="permBox" class="perm hidden"></div>
      </div>
      <form class="add" id="addForm">
        <input id="typed" type="text" autocomplete="off">
        <button class="btn primary" type="submit" id="addBtn">Add</button>
      </form>
      <div class="store-row">
        <label for="storeSelect" id="storeLabel">Store</label>
        <select id="storeSelect" class="field"></select>
        <button class="chip" id="editRouteBtn" type="button">Edit route</button>
      </div>
      <div class="meta">
        <span id="count"></span>
        <span>
          <button class="btn ghost" id="copyBtn" type="button"></button>
          <button class="btn ghost" id="saveTripBtn" type="button"></button>
          <button class="btn ghost hidden" id="clearChecked" type="button"></button>
          <button class="btn danger" id="clear" type="button"></button>
        </span>
      </div>
      <div class="list" id="list"></div>
      <div id="undoBar" class="toast hidden"></div>
    </section>
    <section id="listsView" class="hidden">
      <form class="edit-bar" id="newListForm">
        <input id="newListName" class="field" maxlength="40">
        <button class="btn primary" type="submit" id="createListBtn"></button>
      </form>
      <button class="btn ghost" id="saveCurrentBtn" type="button"></button>
      <div id="savedBox" class="saved-card"></div>
      <button class="btn ghost" id="backFromLists" type="button"></button>
    </section>
    <section id="editView" class="hidden">
      <form class="edit-bar" id="renameForm">
        <input id="renameInput" class="field" maxlength="40">
        <button class="btn primary" type="submit" id="renameBtn"></button>
      </form>
      <p class="sub" id="editHint" style="margin-bottom:10px"></p>
      <div class="mic-wrap">
        <button class="mic" id="micEdit" type="button">🎤</button>
        <div class="status" id="statusEdit"></div>
      </div>
      <form class="add" id="editAddForm">
        <input id="editTyped" type="text" autocomplete="off">
        <button class="btn primary" type="submit" id="editAddBtn">Add</button>
      </form>
      <div class="list" id="editList"></div>
      <button class="btn ghost" id="backShop" type="button"></button>
    </section>
    <p class="hint" id="hint"></p>
  </div>
  <div class="overlay hidden" id="helpOverlay">
    <div class="help-box">
      <h2 id="helpTitle">Get it working</h2>
      <p class="muted" id="helpIntro"></p>
      <h3 id="helpAndTitle">Android</h3>
      <ol id="helpAnd"></ol>
      <h3 id="helpIosTitle">iPhone</h3>
      <ol id="helpIos"></ol>
      <h3 id="helpHomeTitle">Add to Home Screen</h3>
      <ol id="helpHome"></ol>
      <h3 id="helpMoreTitle">If the mic says “not allowed”</h3>
      <ol id="helpMore"></ol>
      <div class="big" style="margin-top:16px">
        <button type="button" class="btn primary" id="helpClose" style="width:100%"></button>
      </div>
    </div>
  </div>
  <div class="overlay hidden" id="routeOverlay">
    <form class="help-box" id="routeForm">
      <h2 id="routeTitle">Store route</h2>
      <p class="muted" id="routeHint"></p>
      <input id="routeName" class="field" maxlength="40" autocomplete="off">
      <ol class="route-list" id="routeList"></ol>
      <div class="route-actions">
        <button type="submit" class="btn primary" id="routeSave">Save</button>
        <button type="button" class="btn ghost" id="routeCancel">Cancel</button>
        <button type="button" class="btn danger" id="routeDelete">Delete store</button>
      </div>
    </form>
  </div>
  <div class="overlay hidden" id="itemOverlay">
    <form class="help-box" id="itemForm">
      <h2 id="itemTitle">Edit item</h2>
      <input id="itemName" class="field" maxlength="60" autocomplete="off">
      <h3 id="itemSectionLabel">Section</h3>
      <div class="cat-picks" id="catPicks"></div>
      <p class="muted" id="itemHint"></p>
      <div class="route-actions">
        <button type="submit" class="btn primary" id="itemSave">Save</button>
        <button type="button" class="btn ghost" id="itemCancel">Cancel</button>
      </div>
    </form>
  </div>
  <div class="overlay hidden" id="langOverlay">
    <div class="chooser">
      <h2 id="chooseTitle">Choose language</h2>
      <p id="chooseSub">You can change this later.</p>
      <div class="big">
        <button type="button" id="pickEn">English</button>
        <button type="button" class="alt" id="pickEs">Español</button>
      </div>
    </div>
  </div>

      const stop=()=>{ pointerId=null; end(); };
      row.addEventListener("pointerup", stop);
      row.addEventListener("pointercancel", stop);
      row.addEventListener("pointerleave", ()=>{ if(pointerId!==null) stop(); });
      row.addEventListener("click", e=>{ if(Math.abs(dx)>12) e.preventDefault(); }, true);
    }
    function renderItems(target, items, onSwipe, onEdit, onRemove){
      target.innerHTML=""; const c=t[lang]||t.en;
      if(!items.length){ const p=document.createElement("p"); p.className="empty"; p.textContent=c.empty; target.appendChild(p); return; }
      // One card per section that has items, in the active store's route order.
      sortByRoute(items, routeSequence(storeRoutes.active)).forEach(({cat, entries})=>{
        const card=document.createElement("section"); card.className="cat-card"+(cat===UNCAT?" uncat no-drag":""); card.dataset.key=cat;
        card.innerHTML=`<header class="cat-head"><span class="cat-emoji" aria-hidden="true"></span><h3></h3><span class="cat-count"></span>${cat===UNCAT?"":`<span class="grip" aria-hidden="true"><svg viewBox="0 0 10 16" width="10" height="16"><circle cx="2" cy="2" r="1.6"/><circle cx="8" cy="2" r="1.6"/><circle cx="2" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="2" cy="14" r="1.6"/><circle cx="8" cy="14" r="1.6"/></svg></span>`}</header><ul class="cat-items"></ul>`;
        card.querySelector(".cat-emoji").textContent=CAT_EMOJI[cat];
        card.querySelector("h3").textContent=c.cats[cat];
        card.querySelector(".cat-count").textContent=entries.filter(e=>!e.item.checked).length||"✓";
        const ul=card.querySelector(".cat-items");
        entries.forEach(({item,i})=>{
          const li=document.createElement("li"); li.className="row"+(item.checked?" done":"");
          li.innerHTML=`<div class="row-inner"><button class="item-text" type="button"></button><button class="x" type="button">✕</button></div>`;
          const label=li.querySelector(".item-text");
          label.textContent=item.text;
          label.onclick=()=>onEdit(i, item);
          if(cat===UNCAT) label.after(sectionDropdown(item.text));
          li.querySelector(".x").onclick=()=>onRemove(i);
          bindSwipe(li, ()=>onSwipe(i));
          ul.appendChild(li);
        });
        target.appendChild(card);
      });
    }
    const catLabel = cat => `${CAT_EMOJI[cat]} ${(t[lang]||t.en).cats[cat]}`;
    // Remember a hand-picked section for this item name; the dictionary guess is used when none is saved.
    function rememberSection(itemName, cat){
      const key=normalize(itemName);
      if(cat===autoCategory(itemName)) delete itemCats[key]; else itemCats[key]=cat;
    }
    function sectionDropdown(itemName){
      const sel=document.createElement("select"); sel.className="cat-fix";
      sel.setAttribute("aria-label", (t[lang]||t.en).pickSection+": "+itemName);
      const ph=document.createElement("option"); ph.value=""; ph.textContent=(t[lang]||t.en).pickSection; ph.disabled=true; ph.selected=true; sel.appendChild(ph);
      CATEGORIES.forEach(cat=>{ const o=document.createElement("option"); o.value=cat; o.textContent=catLabel(cat); sel.appendChild(o); });
      sel.onchange=()=>{ rememberSection(itemName, sel.value); save(); render(); };
      return sel;
    }
    // Press and hold (or grab the dotted grip) to drag a block up or down. onDrop gets the new key order.
    let sortDrag=null;
    document.addEventListener("touchmove", e=>{ if(sortDrag) e.preventDefault(); }, { passive:false });
    function makeSortable(container, itemSel, handleSel, scroller, onDrop){
      container.addEventListener("contextmenu", e=>{ if(e.target.closest(handleSel)) e.preventDefault(); });
      container.addEventListener("pointerdown", e=>{
        if(e.button>0 || sortDrag || e.target.closest("button, select, input")) return;
        const handle=e.target.closest(handleSel), item=handle && handle.closest(itemSel);
        if(!item || !container.contains(item) || item.classList.contains("no-drag")) return;
        const pid=e.pointerId, x0=e.clientX, y0=e.clientY;
        let lastY=y0, timer=setTimeout(begin, e.target.closest(".grip") ? 0 : 350);
        const layoutTop = el => container.getBoundingClientRect().top + el.offsetTop; // ignores transforms
        function begin(){
          timer=null;
          sortDrag={ item, grab:lastY-layoutTop(item), raf:0 };
          item.classList.add("dragging");
          if(navigator.vibrate) navigator.vibrate(12);
          tick();
        }
        function tick(){
          const edge=70, h=scroller===window ? innerHeight : scroller.getBoundingClientRect().bottom;
          const top=scroller===window ? 0 : scroller.getBoundingClientRect().top;
          if(lastY<top+edge) scroller.scrollBy(0, -Math.ceil((top+edge-lastY)/6));
          else if(lastY>h-edge) scroller.scrollBy(0, Math.ceil((lastY-(h-edge))/6));
          const others=[...container.querySelectorAll(itemSel)].filter(el=>el!==item);
          const fixed=others.find(el=>el.classList.contains("no-drag")) || null;
          const before=others.find(el=>!el.classList.contains("no-drag") && lastY < layoutTop(el)+el.offsetHeight/2) || fixed;
          if(before!==item.nextElementSibling){
            const tops=new Map(others.map(el=>[el, el.offsetTop]));
            container.insertBefore(item, before);
            others.forEach(el=>{ const dy=tops.get(el)-el.offsetTop; if(!dy) return;
              el.style.transition="none"; el.style.transform=`translateY(${dy}px)`; el.offsetHeight;
              el.style.transition="transform .15s ease"; el.style.transform=""; });
          }
          item.style.transform=`translateY(${lastY-sortDrag.grab-layoutTop(item)}px)`;
          sortDrag.raf=requestAnimationFrame(tick);
        }
        const move=ev=>{ if(ev.pointerId!==pid) return; lastY=ev.clientY;
          if(timer && (Math.abs(ev.clientX-x0)>10 || Math.abs(ev.clientY-y0)>10)) cleanup(); }; // it's a scroll, not a hold
        const up=ev=>{ if(ev.pointerId===pid) finish(); };
        // Listen on window: moving the card in the DOM drops pointer capture, so events stop reaching it.
        addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
        function cleanup(){ clearTimeout(timer); timer=null;
          removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up); }
        function finish(){
          cleanup();
          if(!sortDrag || sortDrag.item!==item) return;
          cancelAnimationFrame(sortDrag.raf); sortDrag=null;
          item.classList.remove("dragging"); item.style.transform="";
          onDrop([...container.querySelectorAll(itemSel)].map(el=>el.dataset.key));
        }
      });
    }
    // Save a dragged order of the visible sections into the active store; hidden sections keep their places.
    function saveVisibleOrder(keys){
      const visible=keys.filter(k=>k!==UNCAT);
      const full=routeSequence(storeRoutes.active).filter(k=>k!==UNCAT);
      let n=0; const merged=full.map(k=>visible.includes(k) ? visible[n++] : k);
      storeRoutes.stores[storeRoutes.active]=merged; save(); render();
    }
    function renderStoreSelect(){
      const c=t[lang]||t.en, sel=$("storeSelect");
      const names=Object.keys(storeRoutes.stores).filter(k=>k!==STANDARD).sort((a,b)=>a.localeCompare(b));
      sel.innerHTML="";
      const opt=(value,label)=>{ const o=document.createElement("option"); o.value=value; o.textContent=label; sel.appendChild(o); };
      opt(STANDARD, c.standardStore); names.forEach(n=>opt(n,n)); opt("__new", c.addStore);
      sel.value=storeRoutes.active;
    }
    function openRouteEditor(key){
      const c=t[lang];
      routeDraft={ key, order: routeSequence(key||STANDARD).filter(x=>x!==UNCAT) };
      $("routeName").value = key===STANDARD ? c.standardStore : (key||"");
      $("routeName").disabled = key===STANDARD;
      $("routeHint").textContent=c.routeHint;
      $("routeDelete").classList.toggle("hidden", !key || key===STANDARD);
      renderRouteList();
      $("routeOverlay").classList.remove("hidden");
      if(!key) $("routeName").focus();
    }
    function closeRouteEditor(){ routeDraft=null; $("routeOverlay").classList.add("hidden"); renderStoreSelect(); }
    function renderRouteList(){
      const c=t[lang], ol=$("routeList"), order=routeDraft.order;
      ol.innerHTML="";
      order.forEach((cat,k)=>{
        const li=document.createElement("li"); li.dataset.key=cat;
        const name=document.createElement("span"); name.textContent=catLabel(cat);
        const grip=document.createElement("span"); grip.className="grip"; grip.setAttribute("aria-hidden","true"); grip.innerHTML=`<svg viewBox="0 0 10 16" width="10" height="16"><circle cx="2" cy="2" r="1.6"/><circle cx="8" cy="2" r="1.6"/><circle cx="2" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="2" cy="14" r="1.6"/><circle cx="8" cy="14" r="1.6"/></svg>`;
        const btn=(sym,label,to)=>{ const b=document.createElement("button"); b.type="button"; b.textContent=sym; b.setAttribute("aria-label",label+": "+c.cats[cat]);
          b.disabled = to<0 || to>=order.length;
          b.onclick=()=>{ [order[k],order[to]]=[order[to],order[k]]; renderRouteList(); ol.children[to].querySelectorAll("button")[to<k?0:1]?.focus(); };
          return b; };
        li.append(grip, name, btn("↑",c.moveUp,k-1), btn("↓",c.moveDown,k+1));
        ol.appendChild(li);
      });
    }
    function renderSaved(){
      const c=t[lang]||t.en;
      if(!lists.length){ $("savedBox").innerHTML=`<p class="empty">${c.noSaved}</p>`; return; }
      $("savedBox").innerHTML="";
      lists.forEach(list=>{
        const div=document.createElement("div"); div.className="saved-item";
        div.innerHTML=`<div><h3></h3><p></p></div><div class="saved-actions"><button data-act="add"></button><button data-act="start"></button><button data-act="edit"></button><button data-act="del"></button></div>`;
        div.querySelector("h3").textContent=list.name;
        div.querySelector("p").textContent=c.itemsOf(list.items.length);
        div.querySelector('[data-act="add"]').textContent=c.addTrip;
        div.querySelector('[data-act="start"]').textContent=c.startTrip;
        div.querySelector('[data-act="edit"]').textContent=c.edit;
        div.querySelector('[data-act="del"]').textContent=c.del;
        div.querySelector('[data-act="add"]').onclick=()=>{ trip=mergeItems(trip,list.items.map(i=>i.text)); save(); showView("shop"); };
        div.querySelector('[data-act="start"]').onclick=()=>{ trip=list.items.map(i=>({...i, checked:false})); save(); showView("shop"); };
        div.querySelector('[data-act="edit"]').onclick=()=>{ editingId=list.id; $("renameInput").value=list.name; showView("edit"); };
        div.querySelector('[data-act="del"]').onclick=()=>{ if(!confirm(c.confirmDel)) return; lists=lists.filter(x=>x.id!==list.id); save(); renderSaved(); };
        $("savedBox").appendChild(div);
      });
    }
    function hideUndo(){ $("undoBar").classList.add("hidden"); $("undoBar").innerHTML=""; lastRemoved=null; if(undoTimer) clearTimeout(undoTimer); }
    function showUndo(item){
      const bar=$("undoBar");
      bar.classList.remove("hidden");
      bar.innerHTML="";
      const msg=document.createElement("span"); msg.textContent=t[lang].undid+": "+item.text;
      const btn=document.createElement("button"); btn.type="button"; btn.textContent=t[lang].undo;
      btn.onclick=()=>{
        if(!lastRemoved) return;
        lastRemoved.arr.splice(lastRemoved.index, 0, lastRemoved.item);
        save(); hideUndo(); render();
      };
      bar.append(msg, btn);
      if(undoTimer) clearTimeout(undoTimer);
      undoTimer=setTimeout(hideUndo, 5000);
    }
    function removeAt(arr, i){
      lastRemoved={ arr, index:i, item:arr[i] };
      arr.splice(i,1); save(); render();
      if(view==="shop") showUndo(lastRemoved.item);
    }
    function editAt(arr, i, item){
      const c=t[lang];
      itemDraft={ arr, i, cat:categorizeItem(item.text), touched:false };
      $("itemName").value=item.text;
      $("itemTitle").textContent=c.editItemTitle; $("itemSectionLabel").textContent=c.section;
      $("itemHint").textContent=c.sectionHint; $("itemSave").textContent=c.saveRoute; $("itemCancel").textContent=c.cancel;
      renderCatPicks();
      $("itemOverlay").classList.remove("hidden");
    }
    function renderCatPicks(){
      const c=t[lang], box=$("catPicks");
      box.innerHTML="";
      [...CATEGORIES, UNCAT].forEach(cat=>{
        const b=document.createElement("button"); b.type="button"; b.textContent=catLabel(cat);
        b.setAttribute("aria-pressed", String(cat===itemDraft.cat));
        b.onclick=()=>{ itemDraft.cat=cat; itemDraft.touched=true; renderCatPicks(); box.children[[...CATEGORIES, UNCAT].indexOf(cat)].focus(); };
        box.appendChild(b);
      });
    }
    function closeItemSheet(){ itemDraft=null; $("itemOverlay").classList.add("hidden"); }
    function saveItemSheet(){
      const { arr, i, cat, touched } = itemDraft;
      const name=$("itemName").value.trim();
      closeItemSheet();
      if(!name){ removeAt(arr,i); return; }
      arr[i]={...arr[i], text:name};
      if(touched) rememberSection(name, cat);
      save(); render();
    }
    function toggleAt(arr, i){
      arr[i]={...arr[i], checked:!arr[i].checked}; save(); render();
    }
    function render(){
      if(!lang) return; applyCopy();
      if(view==="shop") renderItems($("list"), trip, i=>toggleAt(trip,i), (i,item)=>editAt(trip,i,item), i=>removeAt(trip,i));
      else if(view==="lists") renderSaved();
      else {
        const list=editingList(); if(!list){ showView("lists"); return; }
        renderItems($("editList"), list.items, i=>removeAt(list.items,i), (i,item)=>editAt(list.items,i,item), i=>removeAt(list.items,i));
      }
    }
    function addTo(arr, text){
      const parts=splitUtterance(text); if(!parts.length) return;
      const merged=mergeItems(arr, parts); arr.length=0; arr.push(...merged); save(); render();
    }
    function makeRecognizer(onText, statusEl, micBtn){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){ micBtn.disabled=true; statusEl.textContent=(t[lang]||t.en).unsupported; return null; }
      const rec=new SR(); rec.continuous=false; rec.interimResults=false;
      rec.onstart=()=>{ micBtn.classList.add("listening"); statusEl.textContent=t[lang].listening; };
      rec.onend=()=>{
        micBtn.classList.remove("listening");
        if ($("permBox").classList.contains("hidden")) statusEl.textContent=t[lang].ready;
      };
      rec.onresult=e=>{ const text=e.results[0][0].transcript.trim(); if(text) onText(text); };
      rec.onerror=e=>{
        micBtn.classList.remove("listening");
        if (e.error==="not-allowed") {
          statusEl.textContent="";
          showPermBlocked();
        } else if (e.error!=="aborted" && e.error!=="no-speech") {
          hidePerm(); statusEl.textContent=e.error;
        } else {
          hidePerm(); statusEl.textContent=t[lang].ready;
        }
      };
      return rec;
    }
    function startRec(rec, micBtn, statusEl){
      if(!rec) return;
      try { rec.lang = lang==="es"?"es-MX":"en-US"; rec.start(); }
      catch { statusEl.textContent=t[lang].already; }
    }
    function setLang(next){
      lang=next; save(); $("langOverlay").classList.add("hidden");
      recTrip=makeRecognizer(text=>addTo(trip,text), $("status"), $("mic"));
      recEdit=makeRecognizer(text=>{ const list=editingList(); if(list) addTo(list.items,text); }, $("statusEdit"), $("micEdit"));
      $("status").textContent=t[lang].firstMic; applyCopy(); render();
      if (!localStorage.getItem("grocery-help-seen")) openHelp();
    }
    function hidePerm(){ $("permBox").classList.add("hidden"); $("permBox").innerHTML=""; }
    function showPermBlocked(){
      const c=t[lang]; const box=$("permBox");
      box.classList.remove("hidden");
      box.innerHTML=`<b>${c.notAllowedTitle}</b>${c.notAllowed}<br><br>${c.notAllowedAnd}<br><br>${c.notAllowedIos}`;
    }
    function openHelp(){ $("helpOverlay").classList.remove("hidden"); localStorage.setItem("grocery-help-seen","1"); }
    function closeHelp(){ $("helpOverlay").classList.add("hidden"); }
    $("helpBtn").onclick=openHelp;
    $("helpClose").onclick=closeHelp;
    $("helpOverlay").addEventListener("click", e=>{ if(e.target.id==="helpOverlay") closeHelp(); });
    $("en").onclick=()=>setLang("en"); $("es").onclick=()=>setLang("es");
    $("pickEn").onclick=()=>setLang("en"); $("pickEs").onclick=()=>setLang("es");
    $("navLists").onclick=()=>showView(view==="shop"?"lists":"shop");
    $("backShop").onclick=()=>showView("shop");
    $("backFromLists").onclick=()=>showView("shop");
    $("addForm").onsubmit=e=>{ e.preventDefault(); const v=$("typed").value.trim(); if(!v) return; addTo(trip,v); $("typed").value=""; };
    $("editAddForm").onsubmit=e=>{ e.preventDefault(); const list=editingList(); const v=$("editTyped").value.trim(); if(!list||!v) return; addTo(list.items,v); $("editTyped").value=""; };
    $("clear").onclick=()=>{ if(!trip.length) return; if(confirm(t[lang].confirmClear)){ trip=[]; save(); render(); } };
    $("clearChecked").onclick=()=>{ if(!trip.some(x=>x.checked)) return; trip=trip.filter(x=>!x.checked); save(); render(); };
    $("newListForm").onsubmit=e=>{ e.preventDefault(); lists.push({id:String(Date.now()), name:$("newListName").value.trim()||t[lang].named, items:[]}); $("newListName").value=""; save(); renderSaved(); };
    function saveTripAsList(){
      if(!trip.length){ $("status").textContent=t[lang].needItems; return; }
      const id=String(Date.now());
      lists.push({id, name:t[lang].named, items:trip.map(i=>({...i, checked:false}))});
      editingId=id; save();
      $("renameInput").value="";
      $("renameInput").placeholder=t[lang].newPlaceholder;
      showView("edit");
      $("statusEdit").textContent=t[lang].savedOk;
      $("renameInput").focus();
    }
    $("copyBtn").onclick=async ()=>{
      if(!trip.length){ $("status").textContent=t[lang].needItems; return; }
      const text=sortByRoute(trip, routeSequence(storeRoutes.active))
        .map(g=>catLabel(g.cat)+"\n"+g.entries.map(({item})=>`${item.checked?"[x]":"-"} ${item.text}`).join("\n"))
        .join("\n\n");
      try {
        await navigator.clipboard.writeText(text);
        $("status").textContent=t[lang].copied;
      } catch {
        prompt(t[lang].copy, text);
      }
    };
    $("saveTripBtn").onclick=saveTripAsList;
    $("saveCurrentBtn").onclick=saveTripAsList;
    $("renameForm").onsubmit=e=>{ e.preventDefault(); const list=editingList(); if(!list) return; const name=$("renameInput").value.trim(); if(name){ list.name=name; save(); applyCopy(); } };
    makeSortable($("list"), ".cat-card", ".cat-head", window, saveVisibleOrder);
    makeSortable($("editList"), ".cat-card", ".cat-head", window, saveVisibleOrder);
    makeSortable($("routeList"), "li", "li", $("routeForm"), keys=>{ routeDraft.order=keys; renderRouteList(); });
    $("storeSelect").onchange=e=>{
      if(e.target.value==="__new"){ e.target.value=storeRoutes.active; openRouteEditor(null); return; }
      storeRoutes.active=e.target.value; save(); render();
    };
    $("editRouteBtn").onclick=()=>openRouteEditor(storeRoutes.active);
    $("routeCancel").onclick=closeRouteEditor;
    $("routeOverlay").addEventListener("click", e=>{ if(e.target.id==="routeOverlay") closeRouteEditor(); });
    $("routeForm").onsubmit=e=>{
      e.preventDefault();
      const { key, order } = routeDraft;
      let name = STANDARD;
      if(key!==STANDARD){
        name=$("routeName").value.trim();
        if(!name || name==="__new"){ $("routeHint").textContent=t[lang].needName; $("routeName").focus(); return; }
        if(key && key!==name) delete storeRoutes.stores[key];
      }
      storeRoutes.stores[name]=order.slice(); storeRoutes.active=name;
      save(); closeRouteEditor(); render();
    };
    $("routeDelete").onclick=()=>{
      const { key } = routeDraft;
      if(!key || key===STANDARD || !confirm(t[lang].confirmDelStore)) return;
      delete storeRoutes.stores[key]; storeRoutes.active=STANDARD;
      save(); closeRouteEditor(); render();
    };
    $("itemForm").onsubmit=e=>{ e.preventDefault(); saveItemSheet(); };
    $("itemCancel").onclick=closeItemSheet;
    $("itemOverlay").addEventListener("click", e=>{ if(e.target.id==="itemOverlay") closeItemSheet(); });
    $("mic").onclick=()=>startRec(recTrip,$("mic"),$("status"));
    $("micEdit").onclick=()=>startRec(recEdit,$("micEdit"),$("statusEdit"));
    if (lang) setLang(lang); else $("langOverlay").classList.remove("hidden");
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
